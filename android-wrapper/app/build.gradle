plugins { id 'com.android.application'; id 'com.google.gms.google-services' }

dependencies { implementation 'com.google.firebase:firebase-messaging:24.0.1' }

android { namespace 'com.caregivers.mobile'; compileSdk 35
    defaultConfig { applicationId 'com.caregivers.mobile'; minSdk 23; targetSdk 35; versionCode 8; versionName '1.7' }
    buildTypes { release { minifyEnabled false; shrinkResources false; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' } }
    flavorDimensions += 'edition'
    productFlavors {
        user { dimension 'edition'; resValue 'string', 'app_name', 'Caregivers'; resValue 'string', 'start_url', 'https://caregivers-production.up.railway.app/' }
        admin { dimension 'edition'; applicationIdSuffix '.admin'; versionCode 4; versionName '1.3'; resValue 'string', 'app_name', 'Caregivers Admin'; resValue 'string', 'start_url', 'https://caregivers-production.up.railway.app/admin' }
    }
}
